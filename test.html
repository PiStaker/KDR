<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KDR Daily Logs</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CDNs -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: system-ui, sans-serif;
            background: #111;
            color: #eee;
        }
        #login-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        #login-box {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            min-width: 260px;
        }
        #login-box input {
            width: 100%;
            margin-bottom: 10px;
            padding: 6px;
            border-radius: 4px;
            border: 1px solid #444;
            background: #111;
            color: #eee;
        }
        #login-box button {
            width: 100%;
            padding: 8px;
            border: none;
            border-radius: 4px;
            background: #3b82f6;
            color: #fff;
            cursor: pointer;
        }
        #app-root {
            display: none;
            padding: 16px;
        }
        .field-group {
            margin-bottom: 10px;
        }
        .field-group input {
            width: 100%;
            padding: 6px;
            border-radius: 4px;
            border: 1px solid #444;
            background: #111;
            color: #eee;
        }
        button.action {
            padding: 8px 12px;
            border-radius: 4px;
            border: none;
            background: #22c55e;
            color: #fff;
            cursor: pointer;
            margin-right: 8px;
        }
    </style>
</head>
<body>

<div id="login-overlay">
    <div id="login-box">
        <h2 style="margin-top:0;margin-bottom:10px;">Login</h2>
        <label>Email</label>
        <input id="login-email" type="email">
        <label>Password</label>
        <input id="login-password" type="password">
        <button id="login-button">Sign In</button>
        <div id="login-error" style="margin-top:8px;color:#ff6b6b;font-size:0.85em;"></div>
    </div>
</div>

<div id="app-root">
    <h1>Daily KDR Logs</h1>

    <div class="field-group">
        <label>Date</label>
        <input id="log-date" type="date">
    </div>
    <div class="field-group">
        <label>Total</label>
        <input id="log-total" type="number" step="1" min="0">
    </div>
    <div class="field-group">
        <label>Kills</label>
        <input id="log-kills" type="number" step="1" min="0">
    </div>
    <div class="field-group">
        <label>Deaths</label>
        <input id="log-deaths" type="number" step="1" min="0">
    </div>
    <div class="field-group">
        <label>Staff Losses</label>
        <input id="log-staff-loss" type="number" step="1" min="0">
    </div>

    <div style="margin-top:12px;">
        <button id="submit-log" class="action">Save Daily Log</button>
        <button id="exportExcel" class="action" style="background:#3b82f6;">Export History (Excel)</button>
    </div>
</div>

<script>
const SUPABASE_URL = "https://gvjtemeettgxiuwjdlga.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd2anRlbWVldHRneGl1d2pkbGdhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMzQ0NzksImV4cCI6MjEwNTYxMDQ3OX0.DTJe9CeITY9YKMDCiv_ECkWuEdXb4Q-v3dy8WGj-y8g";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let currentUser = null;

async function initAuth() {
    const { data } = await sb.auth.getUser();
    if (data && data.user) {
        currentUser = data.user;
        showApp();
    } else {
        showLogin();
    }
}

function showLogin() {
    const overlay = document.getElementById("login-overlay");
    const app = document.getElementById("app-root");
    if (overlay) overlay.style.display = "flex";
    if (app) app.style.display = "none";
}

function showApp() {
    const overlay = document.getElementById("login-overlay");
    const app = document.getElementById("app-root");
    if (overlay) overlay.style.display = "none";
    if (app) app.style.display = "block";
}

async function handleLogin() {
    const email = document.getElementById("login-email").value.trim();
    const password = document.getElementById("login-password").value.trim();
    const errorBox = document.getElementById("login-error");
    errorBox.textContent = "";

    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
        errorBox.textContent = "Login failed.";
        return;
    }
    currentUser = data.user;
    showApp();
}

async function submitDailyLog(logData) {
    if (!currentUser) return;

    await sb.from("daily_logs").insert({
        user_id: currentUser.id,
        date: logData.date,
        total: logData.total,
        kills: logData.kills,
        deaths: logData.deaths,
        staff_loss_count: logData.staffLossCount
    });
}

async function exportHistoryToExcel() {
    if (!currentUser) return;

    const { data, error } = await sb
        .from("daily_logs")
        .select("*")
        .eq("user_id", currentUser.id)
        .order("date", { ascending: true });

    if (error || !data) return;

    const rows = data.map(row => ({
        Date: row.date,
        Total: row.total,
        Kills: row.kills,
        Deaths: row.deaths,
        StaffLosses: row.staff_loss_count
    }));

    const ws = XLSX.utils.json_to_sheet(rows);

    const dateCol = XLSX.utils.decode_col("A");
    for (let i = 2; i <= rows.length + 1; i++) {
        const cellRef = XLSX.utils.encode_cell({ r: i - 1, c: dateCol });
        const cell = ws[cellRef];
        if (cell && cell.v) {
            cell.t = "d";
            cell.z = "dd/mm/yyyy";
            cell.v = new Date(cell.v);
        }
    }

    const totalCol = XLSX.utils.decode_col("B");
    for (let i = 2; i <= rows.length + 1; i++) {
        const cellRef = XLSX.utils.encode_cell({ r: i - 1, c: totalCol });
        const cell = ws[cellRef];
        if (cell && typeof cell.v === "number") {
            cell.t = "n";
            cell.z = "#,##0";
        }
    }

    ws["!cols"] = [
        { wch: 12 },
        { wch: 10 },
        { wch: 10 },
        { wch: 10 },
        { wch: 12 }
    ];

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Daily Logs");

    XLSX.writeFile(wb, "kdr_history.xlsx");
}

document.addEventListener("DOMContentLoaded", () => {
    initAuth();

    const loginBtn = document.getElementById("login-button");
    const submitBtn = document.getElementById("submit-log");
    const exportBtn = document.getElementById("exportExcel");

    if (loginBtn) {
        loginBtn.onclick = () => {
            handleLogin();
        };
    }

    if (submitBtn) {
        submitBtn.onclick = () => {
            const date = document.getElementById("log-date").value;
            const total = Number(document.getElementById("log-total").value || 0);
            const kills = Number(document.getElementById("log-kills").value || 0);
            const deaths = Number(document.getElementById("log-deaths").value || 0);
            const staffLossCount = Number(document.getElementById("log-staff-loss").value || 0);

            submitDailyLog({ date, total, kills, deaths, staffLossCount });
        };
    }

    if (exportBtn) {
        exportBtn.onclick = () => {
            exportHistoryToExcel();
        };
    }
});
</script>

</body>
</html>
