<!DOCTYPE html>
<html>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<head>
<title>OSRS KDR Tracker</title>
<link rel="icon" type="image/x-icon" href="https://pistaker.github.io/KDR/favicon.png">
<style>
body {
font-family: Arial, sans-serif;
background-image: url("https://oldschool.runescape.wiki/images/Login_background_%28Halloween%29.png?f5662");
background-size: cover;
background-position: center;
background-repeat: no-repeat;
background-attachment: fixed;
color: #f5e6c8;
text-align: center;
padding-top: 20px;
min-height: 100vh;
}
h1 {
    font-size: 36px;
    color: #f5e6c8;
    text-shadow: 2px 2px #000;
}
/* Base button and input layout */
button, input {
    font-size: 18px;
    height: 48px;
    padding: 0 16px;
    margin: 6px;
    border: 2px solid #c9a441;
    border-radius: 6px;
    background: #3a2f1b;
    color: #f5e6c8;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    box-sizing: border-box;
    vertical-align: middle;
}
button:hover {
    background: #4a3b22;
}
input {
    background: #2b2416;
}
img.icon {
    width: 24px;
    height: 24px;
    display: inline-block;
}
/* Button Colors */
#deathBtn { background: #5b1f1f; }
#itemBtn { background: #3b245b; }
#settingsBtn { background: #166f5b; }
#ConsumableBtn { background: #3366cc; }
/* Toolbar */
.toolbar {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    margin-top: 10px;
}
#stats {
    font-size: 24px;
    margin-top: 20px;
    line-height: 1.6;
    background: rgba(0,0,0,0.6);
    display: inline-block;
    padding: 10px 20px;
    border-radius: 10px;
    border: 2px solid #c9a441;
}
#itemLog {
    margin-top: 15px;
    font-size: 20px;
}
#killInput, #deathInput, #consumableInput, #itemInput {
    width: 220px;
    text-align: center;
}
.panel {
    display: none;
    margin-top: 20px;
    padding: 15px;
    background: #2b2416;
    border-radius: 10px;
    border: 2px solid #c9a441;
    width: 90%;
    max-width: 850px;
    margin-left: auto;
    margin-right: auto;
}
table {
    width: 100%;
    margin-top: 10px;
    border-collapse: collapse;
    background: #3a2f1b;
}
th, td {
    padding: 8px;
    border: 1px solid #2b2416;
}
th {
    background: #4a3b22;
}
</style>
</head>
<body>
<!-- Audio Elements -->
<audio id="failSound" src="https://pistaker.github.io/KDR/fail.mp3" preload="auto"></audio>
<audio id="killSound" src="https://pistaker.github.io/KDR/Kill.mp3" preload="auto"></audio>
<audio id="EatSound" src="https://pistaker.github.io/KDR/Eat.mp3" preload="auto"></audio>
<audio id="CrySound" src="https://pistaker.github.io/KDR/Cry.mp3" preload="auto"></audio>
<audio id="UndoSound" src="https://pistaker.github.io/KDR/Undo.mp3" preload="auto"></audio>

<h1>OSRS KDR Tracker</h1>
<div id="stats"></div>
<br>

<!-- Main Controls -->
<button id="deathBtn">
    <img class="icon" src="https://oldschool.runescape.wiki/images/Skull.png">
    <span> Death </span>
</button>
<button id="itemBtn">
    <img class="icon" src="https://oldschool.runescape.wiki/images/Items_kept_on_death.png?dd21d">
    <span id="itemValue">Item Loss</span>
</button>
<button id="ConsumableBtn">
    <img class="icon" src="https://oldschool.runescape.wiki/images/Anglerfish_detail.png?ad2dd">
    <span id="consumableText">Consumables</span>
</button>
    
<br>
<!-- Kill Input Grid -->
<input id="killInput" placeholder="Kill (Key Value)">
<button id="killAddBtn">
    <img class="icon" src="https://oldschool.runescape.wiki/images/Strength_icon_%28detail%29.png?a4903" alt="Strength Icon">
    <span id="killAddText">Add Kill</span>
</button>

<!-- Navigation Toolbar -->
<div class="toolbar">
    <button id="undoBtn">Undo</button>
    <button id="settingsBtn">
        <img class="icon" src="https://oldschool.runescape.wiki/images/Settings.png?99265">
        <span>Settings</span>
    </button>
    <button id="historyBtn">History</button>
</div>

<div id="itemLog"></div>
<div id="consumableLog"></div>

<!-- SETTINGS PANEL -->
<div class="panel" id="settingsPanel">
    <h2>Settings</h2>
    <input id="deathInput" placeholder="Death value">
    <input id="consumableInput" placeholder="Consumables value">
    <input id="itemInput" placeholder="Item Loss value">
    <br><br>
    <button id="saveSettingsBtn">Save Values</button>
    <button id="resetBtn" style="background: #5b1f1f;">Reset Today's Data</button>
</div>

<!-- HISTORY PANEL -->
<div class="panel" id="historyPanel">
    <h2>History</h2>
    <div id="historyTable"></div>
    <br>
    <button id="exportExcel">Export Excel</button>
</div>

<script>
/* --- Local State --- */
const todayKey = "kdr-" + new Date().toISOString().slice(0, 10);
let saved = JSON.parse(localStorage.getItem(todayKey)) || {};
let total = saved.total ?? 0;
let kills = saved.kills ?? 0;
let deaths = saved.deaths ?? 0;
let itemLossCount = saved.itemLossCount ?? 0;
let consumableCount = saved.consumableCount ?? 0;
let deathValue = saved.deathValue ?? 128000;
let consumableValue = saved.consumableValue ?? 25000;
let itemValue = saved.itemValue ?? 96000; 
let highestKill = saved.highestKill ?? 0;
let lowestKill = saved.lowestKill ?? null;
let historyStack = [];

/* --- Sound Handler --- */
function playSFX(audioId) {
    const sound = document.getElementById(audioId);
    if (sound) {
        sound.currentTime = 0;
        sound.play().catch(e => console.error("Audio playback error:", e));
    }
}

/* --- UI Update --- */
function updateDisplay() {
    let kd = deaths === 0 ? kills : (kills / deaths).toFixed(2);
    
    // Total formatting (Red if below 0)
    let totalColorStyle = total < 0 ? 'style="color: #ff5555; font-weight: bold;"' : '';
    
    // K/D formatting (Red if less than 1.00)
    let kdColorStyle = parseFloat(kd) < 1.00 ? 'style="color: #ff5555; font-weight: bold;"' : '';

    document.getElementById("stats").innerHTML =
        "Total: <span " + totalColorStyle + ">" + total.toLocaleString() + " GP</span><br>" +
        "Kills: " + kills + "<br>" +
        "Deaths: " + deaths + "<br>" +
        "K/D Ratio: <span " + kdColorStyle + ">" + kd + "</span>";
        
    document.getElementById("itemLog").innerHTML =
        "<strong>Item Losses:</strong> " + itemLossCount;
    document.querySelector("#deathBtn span").textContent =
        "Death (-" + deathValue.toLocaleString() + ")";
    document.getElementById("itemValue").textContent =
        "Item Loss (-" + itemValue.toLocaleString() + ")";
    document.getElementById("consumableText").textContent =
        "Consumables (-" + consumableValue.toLocaleString() + ")";
    document.getElementById("consumableLog").innerHTML =
        "Consumables Burnt : " + consumableCount;
}

/* --- Helpers --- */
function saveState() {
    historyStack.push({
        total,
        kills,
        deaths,
        itemLossCount,
        itemValue,
        consumableCount,
        deathValue,
        consumableValue,
        highestKill,
        lowestKill
    });
}

function saveLocal() {
    localStorage.setItem(todayKey, JSON.stringify({
        total,
        kills,
        deaths,
        itemLossCount,
        itemValue,
        consumableCount,
        deathValue,
        consumableValue,
        highestKill,
        lowestKill
    }));
}
function parseInput(input) {
    input = input.trim().toLowerCase();
    if (input.endsWith("m")) return parseFloat(input.slice(0, -1)) * 1000000;
    if (input.endsWith("k")) return parseFloat(input.slice(0, -1)) * 1000;
    let num = parseFloat(input);
    if (!isNaN(num)) return num * 1000;
    return NaN;
}

/* --- Kill Add --- */
function addKill() {
    let raw = document.getElementById("killInput").value;
    let parsed = parseInput(raw);
    if (!isNaN(parsed)) {
        saveState();
        total += parsed;
        kills++;

        if (parsed > highestKill) {
            highestKill = parsed;
        }
        if (lowestKill === null || parsed < lowestKill) {
            lowestKill = parsed;
        }

        playSFX("killSound");
        saveLocal();
        updateDisplay();
        document.getElementById("killInput").value = "";
    } else {
        alert("Enter a valid number.");
    }
}
document.getElementById("killAddBtn").onclick = addKill;
document.getElementById("killInput").addEventListener("keydown", e => {
    if (e.key === "Enter") addKill();
});

/* --- Death --- */
document.getElementById("deathBtn").onclick = () => {
    saveState();
    total -= deathValue;
    deaths++;
    saveLocal();
    updateDisplay();
    playSFX("failSound");
};

/* --- Item Loss --- */
document.getElementById("itemBtn").onclick = () => {
    saveState();
    total -= itemValue;
    itemLossCount++;
    saveLocal();
    updateDisplay();
    playSFX("CrySound");
};

/* --- Consumable Consumption --- */
document.getElementById("ConsumableBtn").onclick = () => {
    saveState();
    total -= consumableValue;
    consumableCount++;
    saveLocal();
    playSFX("EatSound");
    updateDisplay();
};

/* --- Undo --- */
document.getElementById("undoBtn").onclick = () => {
    if (historyStack.length === 0) {
        alert("Nothing to undo.");
        return;
    }
    let prev = historyStack.pop();
    total = prev.total;
    kills = prev.kills;
    deaths = prev.deaths;
    itemLossCount = prev.itemLossCount;
    consumableCount = prev.consumableCount ?? 0;
    deathValue = prev.deathValue;
    consumableValue = prev.consumableValue ?? 25000;
    itemValue = prev.itemValue ?? 96000;
    highestKill = prev.highestKill ?? 0;
    lowestKill = prev.lowestKill ?? null;
    saveLocal();
    playSFX("UndoSound");
    updateDisplay();
};

/* --- Reset --- */
document.getElementById("resetBtn").onclick = () => {
    if (!confirm("Are you sure you want to clear all of today's data?")) {
        return;
    }
    saveState();
    total = 0;
    kills = 0;
    deaths = 0;
    itemLossCount = 0;
    consumableCount = 0;
    highestKill = 0;
    lowestKill = null;
    saveLocal();
    updateDisplay();
    alert("Today's data has been reset.");
};

/* --- Visual Panel Toggles --- */
function togglePanel(id) {
    const panel = document.getElementById(id);
    panel.style.display = panel.style.display === "none" ? "block" : "none";
}
document.getElementById("settingsBtn").onclick = () => togglePanel("settingsPanel");
document.getElementById("historyBtn").onclick = () => {
    const panel = document.getElementById("historyPanel");
    panel.style.display = (panel.style.display === "none" || panel.style.display === "") ? "block" : "none";
    if (panel.style.display === "block") {
        loadHistory();
    }
};

/* --- Configuration Settings Save --- */
document.getElementById("saveSettingsBtn").onclick = () => {
    let deathParsed = parseInput(document.getElementById("deathInput").value);
    let consumableParsed = parseInput(document.getElementById("consumableInput").value);
    let itemParsed = parseInput(document.getElementById("itemInput").value);
    
    saveState();
    if (!isNaN(deathParsed)) deathValue = deathParsed;
    if (!isNaN(consumableParsed)) consumableValue = consumableParsed;
    if (!isNaN(itemParsed)) itemValue = itemParsed;
    
    saveLocal();
    updateDisplay();
    
    document.getElementById("deathInput").value = "";
    document.getElementById("consumableInput").value = "";
    document.getElementById("itemInput").value = "";
    alert("Settings updated.");
};

/* --- Render History Data Table --- */
function loadHistory() {
    document.getElementById("historyTable").innerHTML = "";
    let keys = Object.keys(localStorage).filter(k => /^kdr-\d{4}-\d{2}-\d{2}$/.test(k));
    keys.sort();
    let sumTotal = 0, sumKills = 0, sumDeaths = 0, sumItemLosses = 0, sumItemLossValue = 0, sumConsumables = 0, sumConsumableValue = 0;
    
    let rows = keys.map(k => {
        let d = JSON.parse(localStorage.getItem(k));
        let rowTotal = d.total ?? 0;
        let rowKills = d.kills ?? 0;
        let rowDeaths = d.deaths ?? 0;
        let rowItems = d.itemLossCount ?? 0;
        let rowItemVal = rowItems * (d.itemValue ?? 96000);
        let rowConsumables = d.consumableCount ?? 0;
        let rowConsumableVal = rowConsumables * (d.consumableValue ?? 25000);
        
        let displayMax = d.highestKill ? d.highestKill.toLocaleString() + " GP" : "-";
        let displayMin = d.lowestKill ? d.lowestKill.toLocaleString() + " GP" : "-";

        sumTotal += rowTotal;
        sumKills += rowKills;
        sumDeaths += rowDeaths;
        sumItemLosses += rowItems;
        sumItemLossValue += rowItemVal;
        sumConsumables += rowConsumables;
        sumConsumableValue += rowConsumableVal;
        
        return `
            <tr>
                <td>${(() => {const [year, month, day] = k.replace("kdr-", "").split("-");return `${day}-${month}-${year}`;})()}</td>
                <td ${rowTotal < 0 ? 'style="color: #ff5555; font-weight: bold;"' : ''}>${rowTotal.toLocaleString()}</td>
                <td>${rowKills}</td>
                <td>${rowDeaths}</td>
                <td>${displayMin}</td>
                <td>${displayMax}</td>
                <td>${rowItems} (-${rowItemVal.toLocaleString()} GP)</td>
                <td>${rowConsumables} (-${rowConsumableVal.toLocaleString()} GP)</td>
            </tr>
        `;
    }).join("");

    document.getElementById("historyTable").innerHTML = `
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Total</th>
                    <th>Kills</th>
                    <th>Deaths</th>
                    <th>Lowest Key</th>
                    <th>Highest Key</th>
                    <th>Item Losses (GP)</th>
                    <th>Consumables (GP)</th>
                </tr>
            </thead>
            <tbody>
                ${rows}
            </tbody>
            <tfoot>
    <tr style="font-weight: bold; background: #2b2416; border-top: 2px solid #c9a441;">
        <td>All Time Total</td>
        <td ${sumTotal < 0 ? 'style="color: #ff5555; font-weight: bold;"' : ''}>${sumTotal.toLocaleString()} GP</td>
        <td>${sumKills}</td>
        <td>${sumDeaths}</td>
        <td>-</td>
        <td>-</td>
        <td>${sumItemLosses} (-${sumItemLossValue.toLocaleString()} GP)</td>
        <td>${sumConsumables} (-${sumConsumableValue.toLocaleString()} GP)</td>
    </tr>
</tfoot>
        </table>
    `;
}


/* --- Export Excel (REAL XLSX) --- */
document.getElementById("exportExcel").onclick = () => {
    const keys = Object.keys(localStorage).filter(k => k.startsWith("kdr-"));
    keys.sort();
    
    const rows = [["Date", "Total GP", "Kills", "Deaths", "Lowest Key", "Highest Key", "Item Losses", "Item Loss GP", "Consumables", "Consumables GP"]];
    
    keys.forEach(k => {
        const raw = localStorage.getItem(k);
        let d;
        try { d = JSON.parse(raw); } catch { return; }
        
        let itemQty = d.itemLossCount ?? 0;
        let itemGP = itemQty * (d.itemValue ?? 96000);
        let conQty = d.consumableCount ?? 0;
        let conGP = conQty * (d.consumableValue ?? 25000);
        
        rows.push([
            k.replace("kdr-", ""),
            d.total ?? 0,
            d.kills ?? 0,
            d.deaths ?? 0,
            d.lowestKill ?? "-",
            d.highestKill ?? "-",
            itemQty,
            -itemGP,
            conQty,
            -conGP
        ]);
    });
    
    const worksheet = XLSX.utils.aoa_to_sheet(rows);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "KDR History");
    XLSX.writeFile(workbook, "kdr_history.xlsx");
};
updateDisplay();
</script>
</body>
</html>
